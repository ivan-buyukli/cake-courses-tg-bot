name = "course-promotion-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
minify = true
rules = [{ type = "Data", globs = ["**/*.woff"], fallthrough = true }]

[vars]
APP_ENV = "production"
CAMPAIGN_TIMEZONE = "Europe/Berlin"

[[d1_databases]]
binding = "COURSE_DB"
database_name = "course-promotion-bot"
# Local-only placeholder. Create a real D1 database before deploying.
database_id = "32970d2a-c5a5-4a33-a7a9-59808c8121b1"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[[queues.producers]]
binding = "COURSE_QUEUE"
queue = "course-deliveries"

[[queues.consumers]]
queue = "course-deliveries"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 5
dead_letter_queue = "course-deliveries-dlq"
